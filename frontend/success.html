<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Confirmed</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f7fb;

        }


        .success-box {

            width: 450px;

            max-width: 90%;

            background: white;

            padding: 45px;

            text-align: center;

            border-radius: 18px;

            box-shadow:
                0 15px 45px
                rgba(24,43,80,.12);

        }


        .check {

            width: 75px;

            height: 75px;

            margin: auto auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #eef3ff;

            color: #356ae6;

            font-size: 38px;

        }


        h1 {

            color: #172033;

            margin-bottom: 12px;

        }


        p {

            color: #697386;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 25px;

        }


        .home-btn {

            display: inline-block;

            text-decoration: none;

            background: #356ae6;

            color: white;

            padding: 13px 25px;

            border-radius: 8px;

            font-weight: 700;

        }

    </style>

</head>


<body>


    <div class="success-box">


        <div class="check">

            ✓

        </div>


        <h1>

            Booking Confirmed!

        </h1>


        <p>

            Your hotel booking and payment
            have been successfully completed.

            <br>

            Thank you for choosing StaySmart.

        </p>


        <a
            href="HomePage.html"
            class="home-btn"
        >

            Back to Home

        </a>


    </div>


</body>

</html>
