<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaySmart · Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { background: #f4f7ff; color: #17366d; }
        nav { background: linear-gradient(135deg, #17366d, #356ae6); color: #fff;
              display: flex; align-items: center; justify-content: space-between;
              padding: 16px 40px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 18px rgba(23,54,109,0.25); }
        nav .logo { font-size: 24px; font-weight: 800; }
        nav .logo span { color: #9fc0ff; }
        nav .links a { color: #dce7ff; text-decoration: none; margin-left: 26px; font-size: 15px; }
        nav .links a:hover, nav .links a.active { color: #fff; }
        nav .user { font-size: 14px; color: #cfe0ff; }
        nav .user button { margin-left: 14px; padding: 7px 16px; border-radius: 8px; border: 1px solid #9fc0ff;
                           background: transparent; color: #fff; cursor: pointer; font-size: 13px; }

        .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 24px; }
        .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
        .head h1 { font-size: 28px; }
        .head p { color: #5b7bbf; font-size: 14px; margin-top: 4px; }
        .head .refresh { padding: 10px 22px; background: #fff; border: 1px solid #cdd9f0; border-radius: 9px;
                         color: #356ae6; font-weight: 700; cursor: pointer; font-size: 14px; }
        .head .refresh:hover { background: #eef4ff; }

        /* KPIs */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; margin-bottom: 34px; }
        .kpi { background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 6px 18px rgba(23,54,109,0.08); }
        .kpi .ico { font-size: 26px; margin-bottom: 10px; }
        .kpi .val { font-size: 30px; font-weight: 800; color: #17366d; }
        .kpi .lbl { font-size: 13px; color: #5b7bbf; margin-top: 4px; }
        .kpi.green .val { color: #1f9d5b; }
        .kpi.blue .val { color: #356ae6; }
        .kpi.orange .val { color: #e6792b; }

        .cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: start; }
        @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
        .panel { background: #fff; border-radius: 16px; padding: 26px; box-shadow: 0 6px 18px rgba(23,54,109,0.08); margin-bottom: 24px; }
        .panel h2 { font-size: 19px; margin-bottom: 18px; }

        /* Bookings table */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 11px 10px; border-bottom: 2px solid #e9f0ff; color: #5b7bbf; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f0f4fc; }
        tr:hover td { background: #f8faff; }
        .pill { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .pill.Confirmed { background: #eef4ff; color: #356ae6; }
        .pill.Checked-In { background: #e6f9ee; color: #1f9d5b; }
        .pill.Checked-Out { background: #f0f0f0; color: #6b7280; }
        .pill.Cancelled { background: #fdeaea; color: #e0454d; }
        select { padding: 6px 10px; border: 1px solid #cdd9f0; border-radius: 7px; font-size: 13px; color: #17366d; cursor: pointer; outline: none; }
        select:focus { border-color: #356ae6; }

        /* Pricing rules */
        .rule { padding: 16px 0; border-bottom: 1px solid #f0f4fc; }
        .rule:last-child { border-bottom: none; }
        .rule .rt { font-weight: 700; margin-bottom: 12px; font-size: 15px; }
        .rule .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .rule label { display: block; font-size: 11px; color: #5b7bbf; margin-bottom: 4px; font-weight: 600; }
        .rule input { width: 100%; padding: 8px 11px; border: 1px solid #cdd9f0; border-radius: 8px; font-size: 14px; color: #17366d; outline: none; }
        .rule input:focus { border-color: #356ae6; }
        .rule .save { margin-top: 12px; padding: 8px 18px; background: #356ae6; color: #fff; border: none;
                      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .rule .save:hover { background: #1f4fc4; }
        .rule .saved { color: #1f9d5b; font-size: 12px; margin-left: 10px; font-weight: 600; }

        .loader { text-align: center; padding: 40px; color: #8aa3d6; }
        footer { background: #17366d; color: #cfe0ff; text-align: center; padding: 24px; font-size: 13px; margin-top: 30px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Stay<span>Smart</span></div>
        <div class="links">
            <a href="HomePage.html">Home</a>
            <a href="Rooms.html">Rooms</a>
            <a href="AdminHomePage.HTML" class="active">Dashboard</a>
        </div>
        <div class="user">
            <span id="greeting">Manager</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="wrap">
        <div class="head">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Live overview of bookings, revenue, and dynamic pricing</p>
            </div>
            <button class="refresh" id="refreshBtn">↻ Refresh</button>
        </div>

        <div class="kpis" id="kpis">
            <div class="loader">Loading KPIs…</div>
        </div>

        <div class="cols">
            <div class="panel">
                <h2>Bookings</h2>
                <div id="bookings"><div class="loader">Loading bookings…</div></div>
            </div>
            <div class="panel">
                <h2>Dynamic Pricing Rules</h2>
                <p>Regular Customers can get a 10% rebate</p>
                <div id="rules"><div class="loader">Loading rules…</div></div>
            </div>
        </div>
    </div>

    <footer>© StaySmart · Smart hotel management</footer>

    <script>
        const API = "https://axujjglrqnppgzoocrng.supabase.co/functions/v1/staysmart-api/api";

        // Session guard — admin only
        (function () {
            const role = localStorage.getItem("ss_role");
            const email = localStorage.getItem("ss_email");
            if (!role || !email) { location.href = "Loginpage.HTML"; return; }
            if (role !== "admin") { location.href = "HomePage.html"; return; }
            document.getElementById("greeting").textContent = "Manager · " + email.split("@")[0];
        })();
        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("ss_role");
            localStorage.removeItem("ss_email");
            location.href = "Loginpage.HTML";
        });
        document.getElementById("refreshBtn").addEventListener("click", () => { loadAll(); });

        async function loadStats() {
            const el = document.getElementById("kpis");
            try {
                const res = await fetch(`${API}/admin/stats/`);
                const data = await res.json();
                if (data.status !== "success") throw new Error();
                const k = data.kpis;
                el.innerHTML = `
                    <div class="kpi green"><div class="ico">💰</div><div class="val">₹${k.totalRevenue.toLocaleString()}</div><div class="lbl">Total Revenue</div></div>
                    <div class="kpi blue"><div class="ico">📋</div><div class="val">${k.totalBookings}</div><div class="lbl">Total Bookings</div></div>
                    <div class="kpi orange"><div class="ico">🏨</div><div class="val">${k.occupancyPercentage}%</div><div class="lbl">Occupancy (${k.checkedInCount}/${k.totalRooms})</div></div>
                    <div class="kpi"><div class="ico">🛬</div><div class="val">${k.checkInsToday}</div><div class="lbl">Check-ins Today</div></div>
                    <div class="kpi"><div class="ico">🛫</div><div class="val">${k.checkOutsToday}</div><div class="lbl">Check-outs Today</div></div>`;
            } catch (e) {
                el.innerHTML = '<div class="loader">Could not load KPIs.</div>';
            }
        }

        const STATUSES = ["Confirmed", "Checked-In", "Checked-Out", "Cancelled"];

        async function loadBookings() {
            const el = document.getElementById("bookings");
            try {
                const res = await fetch(`${API}/bookings/`);
                const data = await res.json();
                if (data.status !== "success") throw new Error();
                if (!data.bookings.length) {
                    el.innerHTML = '<div class="loader">No bookings yet.</div>';
                    return;
                }
                el.innerHTML = `
                    <table>
                        <thead><tr>
                            <th>ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>₹ Paid</th><th>Status</th>
                        </tr></thead>
                        <tbody>${data.bookings.map(b => `
                            <tr>
                                <td><b>${b.id}</b></td>
                                <td>${b.guestName}<br><span style="color:#8aa3d6;font-size:12px">${b.guestEmail}</span></td>
                                <td>${b.room}</td>
                                <td>${b.checkIn}</td>
                                <td>${b.checkOut}</td>
                                <td>₹${b.pricePaid.toLocaleString()}</td>
                                <td>
                                    <select data-id="${b.id}" data-prev="${b.status}">
                                        ${STATUSES.map(s => `<option value="${s}" ${s === b.status ? "selected" : ""}>${s}</option>`).join("")}
                                    </select>
                                </td>
                            </tr>`).join("")}
                        </tbody>
                    </table>`;

                el.querySelectorAll("select").forEach(sel => {
                    sel.addEventListener("change", async () => {
                        const id = sel.getAttribute("data-id");
                        const prev = sel.getAttribute("data-prev");
                        const status = sel.value;
                        try {
                            const res = await fetch(`${API}/bookings/${encodeURIComponent(id)}/status/`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ status }),
                            });
                            const data = await res.json();
                            if (data.status === "success") {
                                sel.setAttribute("data-prev", status);
                                sel.style.borderColor = "#1f9d5b";
                                setTimeout(() => { sel.style.borderColor = ""; loadStats(); }, 1200);
                            } else {
                                sel.value = prev;
                                alert("Could not update status.");
                            }
                        } catch (e) {
                            sel.value = prev;
                            alert("Network error updating status.");
                        }
                    });
                });
            } catch (e) {
                el.innerHTML = '<div class="loader">Could not load bookings.</div>';
            }
        }

        async function loadRules() {
            const el = document.getElementById("rules");
            try {
                const res = await fetch(`${API}/pricing-rules/`);
                const data = await res.json();
                if (data.status !== "success") throw new Error();
                if (!data.rules.length) {
                    el.innerHTML = '<div class="loader">No pricing rules configured.</div>';
                    return;
                }
                el.innerHTML = data.rules.map(r => `
                    <div class="rule" data-rt="${r.room_type}">
                        <div class="rt">${r.room_type}</div>
                        <div class="grid">
                            <div><label>Weekend multiplier</label><input type="number" step="0.01" min="1" max="4" class="wknd" value="${r.weekend_multiplier}"></div>
                            <div><label>High-occupancy multiplier</label><input type="number" step="0.01" min="1" max="3" class="hiocc" value="${r.high_occupancy_multiplier}"></div>
                        </div>
                        <button class="save">Save</button><span class="saved" style="display:none">Saved ✓</span>
                    </div>`).join("");

                el.querySelectorAll(".rule").forEach(rule => {
                    rule.querySelector(".save").addEventListener("click", async () => {
                        const roomType = rule.getAttribute("data-rt");
                        const weekendMultiplier = Number(rule.querySelector(".wknd").value);
                        const highOccupancyMultiplier = Number(rule.querySelector(".hiocc").value);
                        const saved = rule.querySelector(".saved");
                        try {
                            const res = await fetch(`${API}/pricing-rules/`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ roomType, weekendMultiplier, highOccupancyMultiplier }),
                            });
                            const data = await res.json();
                            if (data.status === "success") {
                                saved.style.display = "inline";
                                setTimeout(() => { saved.style.display = "none"; }, 1800);
                            } else {
                                alert("Could not save rule.");
                            }
                        } catch (e) {
                            alert("Network error saving rule.");
                        }
                    });
                });
            } catch (e) {
                el.innerHTML = '<div class="loader">Could not load pricing rules.</div>';
            }
        }

        function loadAll() { loadStats(); loadBookings(); loadRules(); }
        loadAll();
    </script>
</body>
</html>
