<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StaySmart - Payment</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: #f5f7fb;

            color: #172033;

        }


        /* NAVBAR */

        .navbar {

            height: 72px;

            background: white;

            border-bottom: 1px solid #e7eaf0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

        }


        .logo {

            font-size: 28px;

            font-weight: 800;

        }


        .logo span {

            color: #356ae6;

        }


        .back {

            text-decoration: none;

            color: #596477;

            font-size: 14px;

            font-weight: 600;

        }


        /* PAGE */

        .payment-container {

            max-width: 1050px;

            margin: 45px auto;

            padding: 0 20px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;

        }


        /* LEFT */

        .payment-left {

            background: white;

            padding: 32px;

            border-radius: 16px;

            border: 1px solid #e5e8ee;

        }


        .label {

            color: #356ae6;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 8px;

        }


        h1 {

            font-size: 32px;

            margin-bottom: 25px;

        }


        /* BOOKING DETAILS */

        .booking-details {

            background: #f5f7fb;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;

        }


        .booking-row {

            display: flex;

            justify-content: space-between;

            padding: 9px 0;

            font-size: 14px;

        }


        .booking-row span {

            color: #697386;

        }


        .booking-row strong {

            color: #172033;

        }


        /* PAYMENT METHODS */

        .payment-methods {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 10px;

            margin-bottom: 20px;

        }


        .method {

            padding: 13px 5px;

            border: 1px solid #dfe3ea;

            border-radius: 8px;

            background: white;

            cursor: pointer;

            text-align: center;

            font-size: 13px;

            font-weight: 600;

        }


        .method.active {

            border: 2px solid #356ae6;

            color: #356ae6;

            background: #eef3ff;

        }


        /* INPUT */

        .form-group {

            margin-bottom: 16px;

        }


        .form-group label {

            display: block;

            color: #697386;

            font-size: 11px;

            font-weight: 800;

            margin-bottom: 7px;

        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #dfe3ea;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

        }


        .form-group input:focus {

            border-color: #356ae6;

        }


        .card-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

        }


        /* PAY BUTTON */

        .pay-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #356ae6;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .pay-btn:hover {

            background: #2858c5;

        }


        /* RIGHT */

        .summary {

            background:

                linear-gradient(
                    135deg,
                    #17366d,
                    #356ae6
                );

            color: white;

            border-radius: 16px;

            padding: 35px;

            height: fit-content;

        }


        .summary h2 {

            font-size: 25px;

            margin-bottom: 25px;

        }


        .summary-room {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 20px;

        }


        .summary-line {

            display: flex;

            justify-content: space-between;

            padding: 12px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,.18);

            font-size: 14px;

        }


        .summary-line span {

            color: #dce7ff;

        }


        .total {

            display: flex;

            justify-content: space-between;

            margin-top: 25px;

            font-size: 22px;

            font-weight: 800;

        }


        .secure {

            margin-top: 30px;

            padding: 14px;

            border-radius: 9px;

            background:
                rgba(255,255,255,.1);

            font-size: 12px;

            line-height: 1.6;

            color: #dce7ff;

        }


        /* RESPONSIVE */

        @media(max-width:750px) {

            .payment-container {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            Stay<span>Smart</span>

        </div>


        <a
            href="rooms.html"
            class="back"
        >

            ← Back to Rooms

        </a>

    </nav>



    <!-- PAYMENT -->

    <div class="payment-container">


        <!-- PAYMENT FORM -->

        <div class="payment-left">


            <div class="label">

                SECURE PAYMENT

            </div>


            <h1>

                Complete Payment

            </h1>



            <!-- PAYMENT METHODS -->

            <div class="payment-methods">


                <div
                    class="method active"
                    onclick="selectMethod(this)"
                >

                    💳 Card

                </div>


                <div
                    class="method"
                    onclick="selectMethod(this)"
                >

                    📱 UPI

                </div>


                <div
                    class="method"
                    onclick="selectMethod(this)"
                >

                    🏦 Net Banking

                </div>


            </div>



            <!-- CARD FORM -->

            <div id="cardForm">


                <div class="form-group">

                    <label>
                        CARD HOLDER NAME
                    </label>

                    <input
                        type="text"
                        id="cardName"
                        placeholder="Enter card holder name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        CARD NUMBER
                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        maxlength="19"
                        placeholder="1234 5678 9012 3456"
                    >

                </div>


                <div class="card-row">


                    <div class="form-group">

                        <label>
                            EXPIRY DATE
                        </label>

                        <input
                            type="text"
                            id="expiry"
                            placeholder="MM/YY"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            CVV
                        </label>

                        <input
                            type="password"
                            id="cvv"
                            maxlength="3"
                            placeholder="123"
                        >

                    </div>


                </div>


            </div>



            <button
                class="pay-btn"
                onclick="makePayment()"
            >

                Pay Now

            </button>


        </div>



        <!-- BOOKING SUMMARY -->

        <div class="summary">


            <h2>

                Booking Summary

            </h2>


            <div
                class="summary-room"
                id="summaryRoom"
            >

                Room

            </div>


            <div class="summary-line">

                <span>
                    Guest
                </span>

                <strong id="summaryGuest">
                    -
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Check-in
                </span>

                <strong id="summaryCheckIn">
                    -
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Check-out
                </span>

                <strong id="summaryCheckOut">
                    -
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Guests
                </span>

                <strong id="summaryGuests">
                    -
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Price
                </span>

                <strong id="summaryPrice">
                    ₹0
                </strong>

            </div>


            <div class="total">

                <span>
                    Total
                </span>

                <span id="totalPrice">
                    ₹0
                </span>

            </div>


            <div class="secure">

                🔒 Your payment information
                is securely processed.

                <br><br>

                This is a demo payment page
                for the hackathon project.

            </div>


        </div>


    </div>



    <script>


        /* =========================
           GET BOOKING DATA
        ========================= */

        const bookingData =
            JSON.parse(
                localStorage.getItem("booking")
            );


        if (bookingData) {


            document.getElementById(
                "summaryRoom"
            ).textContent =
                bookingData.room;


            document.getElementById(
                "summaryGuest"
            ).textContent =
                bookingData.guest;


            document.getElementById(
                "summaryCheckIn"
            ).textContent =
                bookingData.checkIn;


            document.getElementById(
                "summaryCheckOut"
            ).textContent =
                bookingData.checkOut;


            document.getElementById(
                "summaryGuests"
            ).textContent =
                bookingData.guests;


            document.getElementById(
                "summaryPrice"
            ).textContent =
                "₹" +
                Number(
                    bookingData.pricePaid
                ).toLocaleString("en-IN");


            document.getElementById(
                "totalPrice"
            ).textContent =
                "₹" +
                Number(
                    bookingData.pricePaid
                ).toLocaleString("en-IN");

        }



        /* =========================
           PAYMENT METHOD
        ========================= */

        function selectMethod(element) {


            document
                .querySelectorAll(".method")
                .forEach(
                    function(method) {

                        method.classList
                            .remove("active");

                    }
                );


            element.classList.add("active");

        }



        /* =========================
           MAKE PAYMENT
        ========================= */

        function makePayment() {


            const cardName =
                document.getElementById(
                    "cardName"
                ).value.trim();


            const cardNumber =
                document.getElementById(
                    "cardNumber"
                ).value.trim();


            const expiry =
                document.getElementById(
                    "expiry"
                ).value.trim();


            const cvv =
                document.getElementById(
                    "cvv"
                ).value.trim();



            if (!cardName) {

                alert(
                    "Please enter card holder name."
                );

                return;

            }


            if (!cardNumber) {

                alert(
                    "Please enter card number."
                );

                return;

            }


            if (!expiry) {

                alert(
                    "Please enter expiry date."
                );

                return;

            }


            if (!cvv) {

                alert(
                    "Please enter CVV."
                );

                return;

            }



            /*
                Save payment status
            */

            localStorage.setItem(
                "paymentStatus",
                "Paid"
            );


            /*
                Redirect to success page
            */

            window.location.href =
                "success.html";

        }

    </script>


</body>

</html>
